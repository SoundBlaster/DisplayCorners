apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: displaycorners.agent_corner.presentation
  title: Агентские сессии в программном скруглении дисплея
  version: 0.1.0
  status: draft
intent:
  summary: Пользователь замечает в углу запрос агента, видит при наведении, какая сессия ждёт, и может перейти к ней.
scope:
  boundedContext: displaycorners_agent_corner
  includes:
    - Нижний правый угол прямоугольного дисплея с видимой программной маской Display Corners.
    - Один общий индикатор и список сессий Codex и Claude Code.
  excludes:
    - Размещение индикатора на дисплее с физически скруглённым углом.
    - Выбор API, установка hooks и реализация перехода в конкретный клиент.
    - Quick actions и выдача разрешений агенту из меню.
provides:
  capabilities:
    - id: displaycorners.agent_corner.presentation_contract
      role: primary
      summary: Согласованный контракт для реализации и проверки индикатора, списка и выбора сессии.
requires:
  capabilities: []
interfaces:
  inbound:
    - id: session_update
      kind: event
      summary: Источник сообщает идентичность сессии в своём клиенте, проект, агент и наблюдаемый статус для показа.
    - id: corner_interaction
      kind: event
      summary: Наведение на индикатор раскрывает список. Щелчок по строке выбирает соответствующую сессию.
  outbound:
    - id: open_session
      kind: event
      summary: Выбор строки адресован исходному клиенту и конкретной сессии, даже если несколько сессий работают в одном проекте.
constraints:
  - id: minimum_macos
    level: MUST
    statement: Минимальная версия macOS для приложения с агентским углом — macOS 26. Поддержка более ранних версий в этой реализации не требуется.
  - id: indicator_on_mask
    level: MUST
    statement: Цветная точка расположена приблизительно в визуальном центре чёрной области программной маски, а не у самого края дисплея. Вся точка помещается среди чёрных пикселей маски при каждом поддерживаемом радиусе и остаётся на месте при открытии списка.
  - id: concentric_menu
    level: MUST
    statement: В эталоне внешний радиус равен 24 pt. Правая и нижняя стороны меню отстоят от соответствующих краёв экрана на 4 pt. Нижняя правая дуга меню имеет радиус 20 pt и общий центр с дугой маски, так что зазор на всей дуге тоже равен 4 pt.
  - id: quiet_material
    level: SHOULD
    statement: Меню использует мягко тонированную полупрозрачную поверхность с тонкой кромкой и читаемыми подписями. Яркий блик и объёмный ободок в согласованный облик не входят.
  - id: attention_priority
    level: MUST
    statement: Пока хотя бы одна сессия ждёт ответа или разрешения пользователя, в маске видна янтарная точка. Она имеет приоритет над синим общим индикатором. Работа обозначена синей точкой. В каждой строке видны доступное название чата, значок агента и текст состояния; название проекта может показываться отдельно и не подменяет название чата. Если название чата неизвестно, показывается нейтральная подпись. Значок имеет текстовое имя для доступности. Отсутствующие данные не подменяются сведениями другой сессии.
  - id: chronological_order
    level: MUST
    statement: При открытии меню строки упорядочены по порядку принятия последнего изменения состояния сессии, от более старых сверху к более свежим снизу. Подтверждение актуальности без изменения состояния не переставляет строку. При одинаковом порядке приёма используется стабильная идентичность сессии. Ожидание не меняет этот порядок.
  - id: stable_open_list
    level: MUST
    statement: Пока меню открыто, существующие строки не пересортировываются. Изменения состояния обновляют существующую строку на месте, без дубликата. Новые сессии добавляются сверху. При добавлении или удалении строк под указателем должна оставаться та же сессия в том же месте экрана. Если это нельзя обеспечить, изменение состава отображаемых строк откладывается до безопасного момента. События и индикатор состояния при этом обновляются. Если сессия исчезла, ожидающая удаления строка не должна запускать переход к другой сессии. При следующем открытии применяется обычный порядок от старых к свежим.
  - id: live_list_acceptance
    level: MUST
    statement: При открытии сессии A и B показаны в порядке последнего изменения состояния. Пока меню открыто, изменение состояния A обновляет строку A без перемещения; повтор того же состояния порядок не меняет. Новая сессия C добавляется сверху, при этом существующие строки остаются на прежних экранных координатах. При исчезновении строки её удаление можно отложить до закрытия меню; такая строка не выдаётся за актуальное состояние и не открывает другую сессию. При повторном открытии порядок строится по последним изменениям. Если добавить строку без перемещения существующих нельзя, добавление откладывается до закрытия меню, а общий индикатор обновляется сразу.
  - id: activation_square
    level: MUST
    statement: Предварительная область наведения представляет собой квадрат 2R × 2R в логических пунктах, прилегающий изнутри дисплея к нижнему правому углу. R — фактический радиус программной маски на этом дисплее. Срабатывание не требует попадания в маленький знак.
  - id: mask_settings
    level: MUST
    statement: Агентский угол отображается на каждом подходящем дисплее с включённой нижней правой программной маской и использует её фактический радиус. При отключении эффекта или нижних углов индикатор и меню этого угла скрыты. Подключение, отключение или изменение параметров дисплея пересчитывает положение.
  - id: minimum_agent_radius
    level: MUST
    statement: Если установлен хотя бы один hook агента, приложение использует фактический радиус масок не меньше 24 pt. Правило действует независимо от наличия активных сессий. Выбранный пользователем радиус сохраняется и снова применяется после удаления всех hooks. Значение 24 pt следует проверить визуально на поддерживаемых дисплеях.
  - id: agent_settings_entry
    level: MUST
    statement: Настройки подключения агентов доступны через существующую точку входа в настройки Display Corners в менюбаре.
  - id: variable_radius
    level: SHOULD
    statement: При фактическом R больше 4 pt нижняя правая дуга меню концентрична маске. Радиус каждого из четырёх углов меню равен меньшему из R минус 4 pt и 20 pt. Отступ меню от обеих кромок равен разнице радиусов, поэтому центры дуг совпадают; при R больше 24 pt отступ увеличивается. Форма дуги совпадает с круглой дугой маски. При установленном hook минимальный фактический радиус должен обеспечивать эту геометрию и размещение точки. Высота меню достаточна, чтобы сохранить радиус даже для одной строки.
  - id: no_fresh_state
    level: MUST
    statement: Истечение срока актуальности данных не означает завершение сессии или ответ пользователя. Устаревшее состояние не отображается как актуальная работа или ожидающий запрос. Представление устаревших данных выбирается при реализации.
  - id: resolved_attention
    level: MUST
    statement: Если после ответа источник сообщает, что сессия продолжила работу, её запрос больше не учитывается как ожидающий. Если все сессии работают, общий знак становится синим. При отсутствии активных сессий остаётся обычная маска.
  - id: row_navigation
    level: MUST
    statement: Наведение в область активации при наличии отображаемых сессий показывает меню без перевода фокуса к агенту. Из индикатора можно перевести указатель в список. Для перехода пользователь нажимает на всю строку. Оба ряда имеют одинаковое действие и оформление без отдельной стрелки.
effects:
  sideEffects:
    - id: request_session_navigation
      kind: event_emit
      summary: Щелчок инициирует переход к выбранной сессии. Запросы разрешений обрабатывает её клиент.
evidence:
  - id: accepted_visual
    kind: example
    path: Design/agent-corner-24pt.svg
    supports: [constraints.indicator_on_mask, constraints.concentric_menu, constraints.quiet_material]
  - id: review_scenario
    kind: documentation
    path: Design/agent-corner.md
    supports: [intent.summary, scope, provides.capabilities.displaycorners.agent_corner.presentation_contract, interfaces, constraints, effects]
  - id: accepted_menu_prototype
    kind: example
    path: prototypes/corner-preview/CornerPreview.swift
    supports: [constraints.concentric_menu, constraints.quiet_material]
provenance:
  sourceConfidence:
    intent: high
    boundary: high
    behavior: unknown
  notes:
    - Пользователь одобрил внешний вид меню в прототипе со значками агентов. Исходный SVG сохраняет образец геометрии; показанный на нём ромб заменён цветной точкой по решению пользователя. Подтверждения работы функции в приложении пока нет.
implementationBindings: []
