apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: displaycorners.codex_hook_adapter
  title: Наблюдение Codex CLI через hooks
  version: 0.1.0
  status: draft
intent:
  summary: Передавать подтверждённые события локального Codex в общий список сессий Display Corners.
scope:
  boundedContext: displaycorners_codex_hook_adapter
  includes:
    - Локальные сессии Codex с явно установленными и доверенными hooks.
    - Неполный снимок наблюдаемых сессий и последующие обновления.
    - Установка и удаление hooks Codex пользователем в настройках Display Corners.
    - Доступность подключения Codex в обычной сборке на macOS 26 и новее.
    - Запрос перехода к наблюдаемой локальной сессии в Codex Desktop по её идентификатору.
  excludes:
    - Выдача или отклонение разрешений и изменение запросов Codex.
    - Заявление о покрытии всех поверхностей Codex или уже запущенных сессий.
    - Гарантия перехода для удалённых сессий и произвольных клиентов Codex.
provides:
  capabilities:
    - id: displaycorners.codex_hook_adapter.observation
      role: primary
      summary: Наблюдение ограниченного набора локальных событий Codex через общий контракт адаптера.
requires:
  capabilities:
    - id: displaycorners.harness_adapter.protocol_contract
interfaces:
  inbound:
    - id: codex_hook
      kind: event
      summary: Codex передаёт hook JSON события, а наблюдатель пересылает только поля, нужные адаптеру.
  outbound:
    - id: session_observations
      kind: event
      summary: Адаптер сообщает snapshot и update или remove через локальный канал потребителю Display Corners.
constraints:
  - id: release_runtime
    level: MUST
    statement: Обычная сборка включает агентский угол и локальную обработку hooks без установленного Python или Xcode Command Line Tools. Установка hooks выполняется пользователем; отсутствие Codex или возможности узнать название чата не мешает работе масок. Отладочные фикстуры и окно диагностики недоступны в обычной сборке.
  - id: trust_and_scope
    level: MUST
    statement: Hook устанавливается только явно и запускается согласно механизму доверия Codex. Сессии, не передавшие событие этому адаптеру, не считаются обнаруженными; снимок неполный.
  - id: settings_installation
    level: MUST
    statement: Пользователь может установить или удалить hooks Display Corners для Codex в существующем окне настроек приложения. Установка не выполняется автоматически и сохраняет другие hooks и настройки Codex. Удаление затрагивает только hooks Display Corners. Приложение сообщает об ошибке и не утверждает, что установленные hooks доверены, до подтверждения Codex. Пути установленных hooks продолжают работать после перезапуска приложения.
  - id: confirmed_activity
    level: MUST
    statement: UserPromptSubmit и SessionStart не подтверждают работу. PostToolUse подтверждает наблюдаемую активность и позволяет временно показать working. PermissionRequest без подтверждения того, что запрос действительно показан пользователю, переводит состояние в unknown, а не в waiting_for_user. События Stop и Interrupt убирают активный ход из текущего списка, но не объявляют сессию завершённой.
  - id: root_session_only
    level: MUST
    statement: События с указанным agent_id относятся к subagent и не обновляют состояние родительской сессии. Первая версия наблюдает только корневые сессии Codex.
  - id: freshness_and_failure
    level: MUST
    statement: По простому таймауту неподтверждённый статус становится unknown. Недоступность адаптера, ошибка обработки или недоставленное событие не меняет разрешения и не блокирует работу Codex.
  - id: session_title
    level: MUST
    statement: Для наблюдаемой сессии адаптер может получить её актуальное название по session_id из локального Codex app-server, без возобновления сессии и загрузки её истории. Если название недоступно, оно остаётся отсутствующим. Получение названия не задерживает обработку hooks; ошибки не мешают отображению состояния.
  - id: minimal_data
    level: MUST
    statement: Наблюдатель передаёт идентификатор сессии, вид события и при наличии имя проекта; текст prompt, данные инструмента и transcript не пересылаются hook в адаптер и не сохраняются адаптером. Ответ app-server с метаданными может содержать дополнительные поля; адаптер извлекает только название и не журналирует остальное.
  - id: desktop_navigation
    level: MUST
    statement: По нажатию на доступную строку локальной сессии Codex приложение передаёт Codex Desktop ссылку codex://threads/<session_id>. Идентификатор берётся из выбранной строки и проверяется перед построением ссылки. Недоступная строка и другие агенты не отправляют запрос. Принятие ссылки системой не считается подтверждением открытия чата; поддержку конкретных версий и клиентов нужно проверять отдельно.
  - id: acceptance
    level: MUST
    statement: В изолированной конфигурации установка и удаление из настроек сохраняют ранее существующие hooks. В проверке изолированного Codex с доверенными hooks событие обработки инструмента доходит до адаптера и показывает working; отсутствие подключения не мешает Codex. Синтетический PermissionRequest не выдаётся за подтверждённое ожидание пользователя. Истечение таймаута делает статус unknown.
effects:
  sideEffects:
    - id: local_observation
      kind: filesystem_write
      summary: Локальные сокеты создаются только при явном запуске адаптера.
    - id: codex_hook_settings
      kind: filesystem_write
      summary: По действию пользователя приложение изменяет только свои записи hooks в конфигурации Codex.
evidence:
  - id: hook_research
    kind: documentation
    path: specs/harness-hooks-research.md
    supports: [constraints.confirmed_activity, constraints.minimal_data]
  - id: codex_adapter_design
    kind: documentation
    path: specs/codex-adapter.md
    supports: [intent.summary, scope, interfaces, constraints, effects]
provenance:
  sourceConfidence:
    intent: high
    boundary: medium
    behavior: unknown
  notes:
    - Первая интеграция ограничена локальной сессией Codex с установленными hooks. Работа в реальных сессиях и отображение разрешений проверяются отдельно.
implementationBindings: []
